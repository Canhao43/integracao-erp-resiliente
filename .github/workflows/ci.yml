name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes e estilo (PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ambiente
        run: cp .env.example .env && php artisan key:generate

      - name: Estilo (Pint)
        run: vendor/bin/pint --test

      - name: Testes
        run: php artisan test

  docker:
    name: Stack Docker com MySQL de verdade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sobe a stack
        run: docker compose up -d --build

      - name: Espera a aplicação responder
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/up > /dev/null && exit 0
            sleep 3
          done
          echo "A aplicação não respondeu em 3 minutos"
          exit 1

      - name: Cadastra um beneficiário pela API
        run: |
          CPF=$(docker compose exec -T app php -r 'require "vendor/autoload.php"; echo Faker\Factory::create("pt_BR")->cpf(false);')
          CHAVE=$(cat /proc/sys/kernel/random/uuid)
          echo "CPF=$CPF" >> "$GITHUB_ENV"
          echo "CHAVE=$CHAVE" >> "$GITHUB_ENV"
          status=$(curl -s -o resposta.json -w '%{http_code}' -X POST http://localhost:8080/api/beneficiarios \
            -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Idempotency-Key: $CHAVE" \
            -d "{\"nome\":\"Teste do CI\",\"cpf\":\"$CPF\",\"data_nascimento\":\"1990-01-01\"}")
          cat resposta.json; echo
          test "$status" = "201"

      - name: Reenvia o mesmo pedido com a mesma chave
        run: |
          status=$(curl -s -D cabecalhos.txt -o reenvio.json -w '%{http_code}' -X POST http://localhost:8080/api/beneficiarios \
            -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Idempotency-Key: $CHAVE" \
            -d "{\"nome\":\"Teste do CI\",\"cpf\":\"$CPF\",\"data_nascimento\":\"1990-01-01\"}")
          test "$status" = "201"
          grep -qi '^Idempotent-Replayed: true' cabecalhos.txt
          cmp resposta.json reenvio.json && echo "Reenvio devolveu a resposta original, byte a byte"

      - name: Cadastra mais 20 com o ERP falhando de propósito
        run: |
          cpfs=$(docker compose exec -T app php -r 'require "vendor/autoload.php"; $f = Faker\Factory::create("pt_BR"); for ($i = 0; $i < 20; $i++) echo $f->unique()->cpf(false), " ";')
          i=0
          for cpf in $cpfs; do
            i=$((i + 1))
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/beneficiarios \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -H "Idempotency-Key: $(cat /proc/sys/kernel/random/uuid)" \
              -d "{\"nome\":\"Lote do CI $i\",\"cpf\":\"$cpf\",\"data_nascimento\":\"1990-01-01\"}")
            test "$status" = "201"
          done

      - name: Espera a fila do ERP esvaziar
        run: |
          for i in $(seq 1 90); do
            pendentes=$(docker compose exec -T db mysql -uapp -papp -N erp_resiliente -e "SELECT COUNT(*) FROM beneficiarios WHERE status_erp <> 'enviado'" 2>/dev/null)
            if [ "$pendentes" = "0" ]; then echo "Fila vazia em ~$((i * 2))s"; exit 0; fi
            sleep 2
          done
          echo "Ainda há $pendentes beneficiários fora do ERP"
          exit 1

      - name: Confere no ERP — todos lá, nenhum duplicado, e as falhas aconteceram
        run: |
          q() { docker compose exec -T db mysql -uapp -papp -N erp_resiliente -e "$1" 2>/dev/null; }
          locais=$(q "SELECT COUNT(*) FROM beneficiarios")
          no_erp=$(q "SELECT COUNT(DISTINCT cpf) FROM erp_simulado_beneficiarios")
          duplicados=$(q "SELECT COUNT(*) FROM (SELECT cpf FROM erp_simulado_beneficiarios GROUP BY cpf HAVING COUNT(*) > 1) d")
          falhas=$(grep -c 'falha injetada' storage/logs/laravel.log || true)
          depois_de_gravar=$(grep -c 'falha injetada depois de gravar' storage/logs/laravel.log || true)
          echo "Beneficiários: $locais | CPFs no ERP: $no_erp | CPFs duplicados no ERP: $duplicados"
          echo "Falhas injetadas pelo ERP: $falhas (depois de gravar: $depois_de_gravar)"
          test "$locais" = "$no_erp"
          test "$duplicados" = "0"
          test "$falhas" -gt 0

      - name: Espera o token vencer e cadastra mais um
        run: |
          sleep 21
          cpf=$(docker compose exec -T app php -r 'require "vendor/autoload.php"; echo Faker\Factory::create("pt_BR")->cpf(false);')
          id=$(curl -s -X POST http://localhost:8080/api/beneficiarios \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -H "Idempotency-Key: $(cat /proc/sys/kernel/random/uuid)" \
            -d "{\"nome\":\"Depois do token vencer\",\"cpf\":\"$cpf\",\"data_nascimento\":\"1990-01-01\"}" | grep -o '"id":[0-9]*' | cut -d: -f2)
          for i in $(seq 1 30); do
            status=$(curl -s "http://localhost:8080/api/beneficiarios/$id" | grep -o '"status":"[a-z]*"' | cut -d'"' -f4)
            if [ "$status" = "enviado" ]; then echo "Enviado depois de o token vencer"; exit 0; fi
            sleep 2
          done
          echo "Status final: $status"
          exit 1

      - name: Confere a auditoria — token renovado antes de vencer e nenhum CPF registrado
        run: |
          q() { docker compose exec -T db mysql -uapp -papp -N erp_resiliente -e "$1" 2>/dev/null; }
          chamadas=$(q "SELECT COUNT(*) FROM chamadas_erp")
          tokens=$(q "SELECT COUNT(*) FROM chamadas_erp WHERE caminho = '/token' AND status_http = 200")
          recusas=$(q "SELECT COUNT(*) FROM chamadas_erp WHERE status_http = 401")
          com_cpf=$(q "SELECT COUNT(*) FROM chamadas_erp c JOIN beneficiarios b ON INSTR(CONCAT_WS('|', c.caminho, IFNULL(c.erro, '')), b.cpf) > 0")
          echo "Chamadas auditadas: $chamadas | tokens emitidos: $tokens | recusas 401: $recusas | linhas com CPF: $com_cpf"
          test "$tokens" -ge 2
          test "$recusas" = "0"
          test "$com_cpf" = "0"

      - name: Testes dentro do container
        run: docker compose exec -T app php artisan test

      - name: Confere no MySQL — o cadastro existe e os testes não tocaram nele
        run: |
          total=$(docker compose exec -T db mysql -uapp -papp -N -e "SELECT COUNT(*) FROM erp_resiliente.beneficiarios WHERE cpf = '$CPF'" 2>/dev/null)
          echo "Registros com o CPF cadastrado pela API: $total"
          test "$total" = "1"

      - name: Logs da stack
        if: failure()
        run: docker compose logs
