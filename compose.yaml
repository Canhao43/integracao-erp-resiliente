# Base comum dos três containers PHP (app, worker e scheduler): mesma imagem, mesmo código.
x-php: &php
  build: docker/php
  volumes:
    - .:/var/www/html
  # Sem "environment:" de propósito: a conexão com o banco vem do .env
  # (ver o comentário no .env.example).

services:
  app:
    <<: *php
    depends_on:
      db:
        condition: service_healthy
    # Pronto = o entrypoint terminou de instalar dependências e rodar as migrations.
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/pronto"]
      interval: 3s
      timeout: 2s
      retries: 100

  # Processa a fila "erp" — um envio por vez (ver EnviarBeneficiarioAoErp::middleware).
  worker:
    <<: *php
    command: php artisan queue:work --queue=erp,default --sleep=1
    depends_on:
      app:
        condition: service_healthy

  # Tarefas agendadas, como a limpeza das chaves de idempotência vencidas.
  scheduler:
    <<: *php
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: erp_resiliente
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-papp"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
